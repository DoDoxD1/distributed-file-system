distributed:
  fs:
    chunk-size-bytes: 1048576
    replication-factor: 3
    gc-retention-seconds: 3600
    node-count: 4
    storage-backend: ${DISTRIBUTED_FS_STORAGE_BACKEND:local}
    max-file-size-bytes: 26214400
    max-user-storage-bytes: 1073741824
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 86400
    refresh-cookie-name: dfs_refresh_token
    refresh-cookie-path: /api/v1/auth
    refresh-cookie-secure: true
    refresh-cookie-same-site: Strict
    storage-root: .dfs-storage
    oracle-object-storage:
      namespace: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_NAMESPACE:}
      bucket: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_BUCKET:}
      object-prefix: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_OBJECT_PREFIX:distributed-fs}
      config-file-path: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONFIG_FILE_PATH:}
      config-profile: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONFIG_PROFILE:DEFAULT}
      connection-timeout-millis: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONNECTION_TIMEOUT_MILLIS:10000}
      read-timeout-millis: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_READ_TIMEOUT_MILLIS:30000}
      max-retries: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_MAX_RETRIES:3}
      initial-backoff-millis: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_INITIAL_BACKOFF_MILLIS:500}
    failure-domains:
      - rack-a
      - rack-b
      - rack-c
      - rack-d

spring:
  application:
    name: distributed-file-storage-system
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SUPABASE_DB_JDBC_URL:${DFS_METADATA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/distributedfs}}
    username: ${SUPABASE_DB_USERNAME:${DFS_METADATA_DATASOURCE_USERNAME:}}
    password: ${SUPABASE_DB_PASSWORD:${DFS_METADATA_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DFS_METADATA_DATASOURCE_MAX_POOL_SIZE:8}
      connection-timeout: ${DFS_METADATA_DATASOURCE_CONNECTION_TIMEOUT_MS:30000}
      data-source-properties:
        sslmode: ${SUPABASE_DB_SSLMODE:require}
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
