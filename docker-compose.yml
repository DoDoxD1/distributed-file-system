services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: distributed-file-storage-system:v1
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DISTRIBUTED_FS_CHUNK_SIZE_BYTES: ${DISTRIBUTED_FS_CHUNK_SIZE_BYTES:-1048576}
      DISTRIBUTED_FS_REPLICATION_FACTOR: ${DISTRIBUTED_FS_REPLICATION_FACTOR:-3}
      DISTRIBUTED_FS_GC_RETENTION_SECONDS: ${DISTRIBUTED_FS_GC_RETENTION_SECONDS:-3600}
      DISTRIBUTED_FS_NODE_COUNT: ${DISTRIBUTED_FS_NODE_COUNT:-4}
      DISTRIBUTED_FS_STORAGE_BACKEND: ${DISTRIBUTED_FS_STORAGE_BACKEND:-local}
      DISTRIBUTED_FS_MAX_FILE_SIZE_BYTES: ${DISTRIBUTED_FS_MAX_FILE_SIZE_BYTES:-26214400}
      DISTRIBUTED_FS_MAX_USER_STORAGE_BYTES: ${DISTRIBUTED_FS_MAX_USER_STORAGE_BYTES:-1073741824}
      DISTRIBUTED_FS_STORAGE_ROOT: ${DISTRIBUTED_FS_STORAGE_ROOT:-/data/chunks}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_NAMESPACE: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_NAMESPACE:-}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_BUCKET: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_BUCKET:-}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_OBJECT_PREFIX: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_OBJECT_PREFIX:-distributed-fs}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONFIG_FILE_PATH: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONFIG_FILE_PATH:-}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONFIG_PROFILE: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONFIG_PROFILE:-DEFAULT}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONNECTION_TIMEOUT_MILLIS: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_CONNECTION_TIMEOUT_MILLIS:-10000}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_READ_TIMEOUT_MILLIS: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_READ_TIMEOUT_MILLIS:-30000}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_MAX_RETRIES: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_MAX_RETRIES:-3}
      DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_INITIAL_BACKOFF_MILLIS: ${DISTRIBUTED_FS_ORACLE_OBJECT_STORAGE_INITIAL_BACKOFF_MILLIS:-500}
      DISTRIBUTED_FS_FAILURE_DOMAINS: ${DISTRIBUTED_FS_FAILURE_DOMAINS:-rack-a,rack-b,rack-c,rack-d}
      DISTRIBUTED_FS_REFRESH_COOKIE_SECURE: ${DISTRIBUTED_FS_REFRESH_COOKIE_SECURE:-true}
      DISTRIBUTED_FS_REFRESH_COOKIE_SAME_SITE: ${DISTRIBUTED_FS_REFRESH_COOKIE_SAME_SITE:-Strict}
      DISTRIBUTED_FS_ACCESS_TOKEN_TTL_SECONDS: ${DISTRIBUTED_FS_ACCESS_TOKEN_TTL_SECONDS:-900}
      DISTRIBUTED_FS_REFRESH_TOKEN_TTL_SECONDS: ${DISTRIBUTED_FS_REFRESH_TOKEN_TTL_SECONDS:-86400}
      SUPABASE_DB_JDBC_URL: ${SUPABASE_DB_JDBC_URL}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_DB_SSLMODE: ${SUPABASE_DB_SSLMODE:-require}
      JAVA_OPTS: ${JAVA_OPTS}
    volumes:
      - type: bind
        source: ${DISTRIBUTED_FS_STORAGE_HOST_PATH:-./data/chunks}
        target: ${DISTRIBUTED_FS_STORAGE_ROOT:-/data/chunks}
    ports:
      - "8080:8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME}
      APP_UPSTREAM: api:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
